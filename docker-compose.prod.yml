# =============================================================================
# CREDO Finanzportal - Produktions-Konfiguration
# =============================================================================
# Voraussetzung: Caddy Reverse Proxy mit externem Netzwerk "reverse_proxy"
# Deployment: ./deploy.sh (Backup + Build + Start). Direkt: mit .env ohne --env-file,
#             mit .env.production: docker compose -f docker-compose.prod.yml --env-file .env.production up -d
# Domain: finance.fes-credo.de
# =============================================================================

services:
  db:
    image: postgres:16-alpine
    container_name: credo-finanz-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: credo
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: finanzportal
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U credo -d finanzportal"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: credo-finanz-app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://credo:${DB_PASSWORD}@db:5432/finanzportal?schema=public
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-CREDO Finanzportal}
      MAIL_FROM_EMAIL: ${MAIL_FROM_EMAIL}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD}
      APP_URL: ${APP_URL:-https://finance.fes-credo.de}
      WEBHOOK_URL_REISEKOSTEN: ${WEBHOOK_URL_REISEKOSTEN:-}
      WEBHOOK_URL_ERSTATTUNG: ${WEBHOOK_URL_ERSTATTUNG:-}
      NODE_ENV: production
      # Löschjob (DEPLOYMENT.md §13). Entscheidung 11.10.2026: bis zur Archivquittung aus DokuBit
      # nichts löschen (Frist 3650 Tage). Moratorium für den Reisekosten-Altbestand bis 2027-03-31 (Code).
      RETENTION_FRIST_TAGE: ${RETENTION_FRIST_TAGE:-3650}
      RETENTION_MORATORIUM_BIS: ${RETENTION_MORATORIUM_BIS:-}
      # Nur für ältere Images (Rückweg, Start ohne --build): Sie lesen RETENTION_TAGE und kennen kein
      # Moratorium — 3650 hält dort alles zurück. Der aktuelle Code liest diesen Wert nicht. Nicht ändern.
      RETENTION_TAGE: "3650"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - reverse_proxy
      - internal

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local

networks:
  reverse_proxy:
    external: true
  internal:
    internal: true
